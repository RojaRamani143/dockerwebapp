version: "3.9"

services:
  devopsdb:
    image: ramaniroja/automation:db
    ports:
      - "3306:3306"
    deploy:
      repicas: 3
   
    networks:
      - mynetwork

  application:
    image: ramaniroja/automation:app
    ports:
      - "1111:8080"
    deploy:
      repicas: 3
    
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
